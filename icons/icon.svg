<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sr-tile" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8E6BFF"/>
      <stop offset="0.55" stop-color="#6A3FF0"/>
      <stop offset="1" stop-color="#3E1FB0"/>
    </linearGradient>
    <linearGradient id="sr-face" x1="0.1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#F3EEFF"/>
      <stop offset="1" stop-color="#CBB8FF"/>
    </linearGradient>
    <linearGradient id="sr-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E5BE8"/>
      <stop offset="1" stop-color="#4A27B8"/>
    </linearGradient>
    <linearGradient id="sr-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="sr-drop" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1B0553" flood-opacity="0.55"/>
    </filter>
    <clipPath id="sr-clip">
      <rect x="2" y="2" width="124" height="124" rx="34"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="2" y="2" width="124" height="124" rx="34" fill="url(#sr-tile)"/>
  <g clip-path="url(#sr-clip)">
    <ellipse cx="44" cy="16" rx="64" ry="34" fill="#ffffff" opacity="0.14"/>
  </g>
  <rect x="3.5" y="3.5" width="121" height="121" rx="32.5" fill="none"
        stroke="url(#sr-rim)" stroke-width="3"/>

  <!-- Sync arrows: down (left) and up (right), extruded -->
  <g filter="url(#sr-drop)">
    <g transform="translate(40,64) rotate(180) skewX(-6)">
      <path d="M0,-33 L19,-12 L6,-12 L6,33 L-6,33 L-6,-12 L-19,-12 Z"
            transform="translate(-4,-5)" fill="url(#sr-side)" stroke="url(#sr-side)"
            stroke-width="9" stroke-linejoin="round"/>
      <path d="M0,-33 L19,-12 L6,-12 L6,33 L-6,33 L-6,-12 L-19,-12 Z"
            fill="url(#sr-face)" stroke="url(#sr-face)"
            stroke-width="9" stroke-linejoin="round"/>
    </g>
    <g transform="translate(88,64) skewX(-6)">
      <path d="M0,-33 L19,-12 L6,-12 L6,33 L-6,33 L-6,-12 L-19,-12 Z"
            transform="translate(4,5)" fill="url(#sr-side)" stroke="url(#sr-side)"
            stroke-width="9" stroke-linejoin="round"/>
      <path d="M0,-33 L19,-12 L6,-12 L6,33 L-6,33 L-6,-12 L-19,-12 Z"
            fill="url(#sr-face)" stroke="url(#sr-face)"
            stroke-width="9" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
