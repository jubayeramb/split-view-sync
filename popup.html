<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syncroll</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.3px;
    }

    .header p {
      font-size: 11px;
      color: #8888aa;
      margin-top: 4px;
    }

    .tab-info {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 12px;
      line-height: 1.6;
    }

    .tab-info .label {
      color: #8888aa;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .tab-info .tab-title {
      color: #c4c4dd;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .tab-info .tab-title.missing {
      color: #e94560;
      font-style: italic;
    }

    .divider {
      height: 1px;
      background: #0f3460;
      margin: 8px 0;
    }

    #btn-sync {
      display: block;
      width: 100%;
      padding: 11px 0;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      background: #533483;
      color: #ffffff;
    }

    #btn-sync:hover:not(:disabled) {
      background: #6b44a0;
    }

    #btn-sync:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #btn-sync.active {
      background: #e94560;
    }

    #btn-sync.active:hover:not(:disabled) {
      background: #ff6b81;
    }

    #status {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
      min-height: 16px;
    }

    #status.success {
      color: #2ecc71;
    }

    #status.error {
      color: #e94560;
    }

    #status.info {
      color: #8888aa;
    }

    .author {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #0f3460;
      text-align: center;
      font-size: 10px;
      color: #6a6a88;
      letter-spacing: 0.2px;
    }

    .author a {
      color: #8888aa;
      text-decoration: none;
      transition: color 0.15s;
    }

    .author a:hover {
      color: #c4c4dd;
    }

    .author-mail {
      display: inline-flex;
      align-items: center;
      margin-left: 6px;
      vertical-align: -1px;
    }

    .author-mail svg {
      width: 11px;
      height: 11px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Syncroll</h1>
    <p>Sync scroll between Split View tabs</p>
  </div>

  <div class="tab-info">
    <div class="label">Left Pane</div>
    <div class="tab-title" id="tab-left">Detecting…</div>
    <div class="divider"></div>
    <div class="label">Right Pane</div>
    <div class="tab-title" id="tab-right">Detecting…</div>
  </div>

  <button id="btn-sync" disabled>Sync Split Panes</button>

  <div id="status" class="info">Scanning open tabs…</div>

  <div class="author">
    by <a href="https://jubayeramb.com?utm_source=syncroll&utm_medium=extension&utm_content=popup-byline" target="_blank" rel="noopener">Jubayer Al Mamun</a><a class="author-mail" href="mailto:jubayeramb@gmail.com" aria-label="Email Jubayer Al Mamun">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="m3 7 9 6 9-6"/>
      </svg>
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
